global:
    scrape_interval: 3s
    evaluation_interval: 3s

# Recording rules pre-aggregate expensive PromQL expressions into new metrics
# so Grafana dashboards read pre-computed values instead of recalculating on
# every panel refresh. See recording.yml for the full set of rules (ADR-0030).
rule_files:
  - "recording.yml"

# Prometheus lives on the Compose network, so we target containers by name +
# unified internal port (ADR-0031 — host ports removed from app instances).
scrape_configs:
  # One application, one target (ADR-0043). Metric NAMES are unchanged from the three-service fleet;
  # only the job label collapsed from three service names into one.
  - job_name: "galactic-fleet"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["galactic-fleet:8080"]

  - job_name: "loki"
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]
